      // Sound Manager using Web Audio API
      class SoundManager {
        constructor() {
          this.ctx = null;
          this.isMuted = false;
        }

        initContext() {
          if (!this.ctx && typeof window !== 'undefined') {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        setMuted(muted) {
          this.isMuted = muted;
        }

        getMuted() {
          return this.isMuted;
        }

        toggleMute() {
          this.isMuted = !this.isMuted;
          return this.isMuted;
        }

        playDiceRoll() {
          if (this.isMuted) return;
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          for (let i = 0; i < 6; i++) {
            const time = now + i * 0.06;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(260 + Math.random() * 220, time);
            gain.gain.setValueAtTime(0.12, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(time);
            osc.stop(time + 0.04);
          }
        }

        playStep() {
          if (this.isMuted) return;
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(660, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        }

        playCorrect() {
          if (this.isMuted) return;
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const time = now + idx * 0.09;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, time);
            gain.gain.setValueAtTime(0.2, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(time);
            osc.stop(time + 0.25);
          });
        }

        playWrong() {
          if (this.isMuted) return;
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.linearRampToValueAtTime(140, now + 0.28);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        }

        playLadderClimb() {
          if (this.isMuted) return;
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [392, 493.88, 587.33, 783.99, 987.77];
          notes.forEach((freq, idx) => {
            const time = now + idx * 0.1;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, time);
            gain.gain.setValueAtTime(0.18, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(time);
            osc.stop(time + 0.3);
          });
        }

        playSnakeSlide() {
          if (this.isMuted) return;
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(160, now + 0.45);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.5);
        }

        playVictory() {
          if (this.isMuted) return;
          this.initContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const melody = [
            { freq: 523.25, dur: 0.15 },
            { freq: 523.25, dur: 0.15 },
            { freq: 523.25, dur: 0.15 },
            { freq: 659.25, dur: 0.45 },
            { freq: 587.33, dur: 0.2 },
            { freq: 659.25, dur: 0.2 },
            { freq: 783.99, dur: 0.6 },
          ];
          let t = now;
          melody.forEach((note) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(note.freq, t);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + note.dur);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + note.dur);
            t += note.dur * 0.9;
          });
        }
      }

      function speakText(text, rate = 0.9) {
        if (typeof window === 'undefined' || !('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'id-ID';
          utterance.rate = rate;
          utterance.pitch = 1.0;
          const voices = window.speechSynthesis.getVoices();
          const idVoice = voices.find(v => v.lang.startsWith('id') || v.lang.includes('ID'));
          if (idVoice) {
            utterance.voice = idVoice;
          }
          window.speechSynthesis.speak(utterance);
        } catch (err) {
          console.warn('Speech synthesis error:', err);
        }
      }

        const available = QUIZ_QUESTIONS.filter(q => !usedIds.has(q.id));
        const pool = available.length > 0 ? available : QUIZ_QUESTIONS;

      const SNAKES = [

      const BONUS_TILES_MAP = {
        12: 'produsen',
        25: 'herbivora',

        57: 'pengurai',
        69: 'biotik',

      function getTileCoordinates(tileNumber) {
        const clamped = Math.max(1, Math.min(100, tileNumber));
        const zeroIndexed = clamped - 1;
        const row = Math.floor(zeroIndexed / 10);
        const remainder = zeroIndexed % 10;
        const col = row % 2 === 0 ? remainder : 9 - remainder;
        return { row, col };
      }

      function generateBoardTiles() {
        const tiles = [];
        for (let n = 1; n <= 100; n++) {
          const { row, col } = getTileCoordinates(n);
          let type = 'normal';
          let ladderTo, snakeTo;
          const ladderBottom = LADDERS.find(l => l.from === n);
          const ladderTop = LADDERS.find(l => l.to === n);
          const snakeHead = SNAKES.find(s => s.from === n);
          const snakeTail = SNAKES.find(s => s.to === n);

          if (ladderBottom) {
            type = 'ladder_bottom';
            ladderTo = ladderBottom.to;
          } else if (ladderTop) {
            type = 'ladder_top';
          } else if (snakeHead) {
            type = 'snake_head';
            snakeTo = snakeHead.to;
          } else if (snakeTail) {
            type = 'snake_tail';
          } else if (BONUS_TILES_MAP[n]) {
            type = 'quiz_bonus';
          }

          const ekosistemId = BONUS_TILES_MAP[n];
          const ekosistemBonus = ekosistemId ? EKOSISTEM_VOCABULARY.find(c => c.id === ekosistemId) : undefined;

          tiles.push({
            number: n,
            row,
            col,
            type,
            ladderTo,
            snakeTo,
            ekosistemBonus,
          });
        }
        return tiles;
      }

          const updateSize = () => {
            if (containerRef.current) {
              const width = containerRef.current.clientWidth;
              const size = Math.min(Math.max(width, 320), 680);
              setBoardSize(size);
            }
          };
          updateSize();
          window.addEventListener('resize', updateSize);
          return () => window.removeEventListener('resize', updateSize);
        }, []);

        const getCellPixelCenter = React.useCallback((tileNumber, size) => {
          const { row, col } = getTileCoordinates(tileNumber);
          const cellSize = size / 10;
          const x = col * cellSize + cellSize / 2;
          const y = (9 - row) * cellSize + cellSize / 2;
          return { x, y, cellSize };
        }, []);

        React.useEffect(() => {
          players.forEach((player, idx) => {
            const { x, y } = getCellPixelCenter(player.position, boardSize);
            if (!animatedPositionsRef.current[idx]) {
              animatedPositionsRef.current[idx] = { x, y, targetX: x, targetY: y, hop: 0 };
            } else {
              animatedPositionsRef.current[idx].targetX = x;
              animatedPositionsRef.current[idx].targetY = y;
            }
          });
        }, [players, boardSize, getCellPixelCenter]);

        React.useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;
          let animationFrameId;

          const dpr = window.devicePixelRatio || 1;
          canvas.width = boardSize * dpr;
          canvas.height = boardSize * dpr;
          canvas.style.width = `${boardSize}px`;
          canvas.style.height = `${boardSize}px`;

          const render = () => {
            ctx.save();
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, boardSize, boardSize);
            const cellSize = boardSize / 10;

            // 1. Draw Tiles
            BOARD_TILES.forEach((tile) => {
              const x = tile.col * cellSize;
              const y = (9 - tile.row) * cellSize;
              const isEven = (tile.row + tile.col) % 2 === 0;

              let bgColor = isEven ? '#F0FDF4' : '#DCFCE7';
              let borderColor = '#86EFAC';

              if (tile.number === 1) {
                bgColor = '#BBF7D0';
                borderColor = '#4ADE80';
              } else if (tile.number === 100) {
                bgColor = '#FEF08A';
                borderColor = '#FACC15';
              } else if (tile.type === 'ladder_bottom') {
                bgColor = '#E0F2FE';
                borderColor = '#7DD3FC';
              } else if (tile.type === 'snake_head') {
                bgColor = '#FFE4E6';
                borderColor = '#FDA4AF';
              } else if (tile.type === 'quiz_bonus') {
                bgColor = '#F3E8FF';
                borderColor = '#D8B4FE';
              }

              if (hoveredTile === tile.number || highlightTile === tile.number) {
                bgColor = '#FEF9C3';
              }

              ctx.fillStyle = bgColor;
              ctx.fillRect(x, y, cellSize, cellSize);
              ctx.strokeStyle = borderColor;
              ctx.lineWidth = 1;
              ctx.strokeRect(x, y, cellSize, cellSize);

              ctx.fillStyle = '#334155';
              ctx.font = `bold ${Math.max(10, Math.floor(cellSize * 0.22))}px 'Plus Jakarta Sans', sans-serif`;
              ctx.textAlign = 'left';
              ctx.textBaseline = 'top';
              ctx.fillText(String(tile.number), x + 4, y + 4);

              if (tile.number === 1) {
                ctx.fillStyle = '#15803D';
                ctx.font = `bold ${Math.floor(cellSize * 0.18)}px 'Plus Jakarta Sans', sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText('START', x + cellSize / 2, y + cellSize * 0.72);
              } else if (tile.number === 100) {
                ctx.fillStyle = '#B45309';
                ctx.font = `bold ${Math.floor(cellSize * 0.18)}px 'Plus Jakarta Sans', sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText('🏆 FINISH', x + cellSize / 2, y + cellSize * 0.72);
              }

              if (tile.ekosistemBonus) {
                ctx.font = `${Math.floor(cellSize * 0.38)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(tile.ekosistemBonus.emoji, x + cellSize / 2, y + cellSize * 0.52);
              }
            });

            // 2. Draw Ladders
            LADDERS.forEach((ladder) => {
              const start = getCellPixelCenter(ladder.from, boardSize);
              const end = getCellPixelCenter(ladder.to, boardSize);
              const dx = end.x - start.x;
              const dy = end.y - start.y;
              const angle = Math.atan2(dy, dx);
              const dist = Math.hypot(dx, dy);

              const railOffset = cellSize * 0.18;
              const perpX = Math.cos(angle + Math.PI / 2) * railOffset;
              const perpY = Math.sin(angle + Math.PI / 2) * railOffset;

              ctx.save();
              ctx.strokeStyle = ladder.color || '#D97706';
              ctx.lineWidth = 4;
              ctx.beginPath();
              ctx.moveTo(start.x - perpX, start.y - perpY);
              ctx.lineTo(end.x - perpX, end.y - perpY);
              ctx.stroke();

              ctx.beginPath();
              ctx.moveTo(start.x + perpX, start.y + perpY);
              ctx.lineTo(end.x + perpX, end.y + perpY);
              ctx.stroke();
              ctx.restore();

              const rungCount = Math.max(3, Math.floor(dist / (cellSize * 0.35)));
              ctx.strokeStyle = ladder.color || '#D97706';
              ctx.lineWidth = 3;
              for (let r = 1; r < rungCount; r++) {
                const t = r / rungCount;
                const rx = start.x + dx * t;
                const ry = start.y + dy * t;
                ctx.beginPath();
                ctx.moveTo(rx - perpX, ry - perpY);
                ctx.lineTo(rx + perpX, ry + perpY);
                ctx.stroke();
              }
            });

            // 3. Draw Snakes
            SNAKES.forEach((snake) => {
              const head = getCellPixelCenter(snake.from, boardSize);
              const tail = getCellPixelCenter(snake.to, boardSize);
              const dx = tail.x - head.x;
              const dy = tail.y - head.y;
              const dist = Math.hypot(dx, dy);

              ctx.save();
              ctx.beginPath();
              ctx.moveTo(head.x, head.y);
              const segments = 4;
              for (let i = 1; i <= segments; i++) {
                const t = i / segments;
                const px = head.x + dx * t;
                const py = head.y + dy * t;
                const sway = Math.sin((i * Math.PI) / 2) * (cellSize * 0.32);
                const nx = -dy / dist;
                const ny = dx / dist;
                if (i % 2 === 1) {
                  ctx.quadraticCurveTo(px + nx * sway, py + ny * sway, px, py);
                } else {
                  ctx.quadraticCurveTo(px - nx * sway, py - ny * sway, px, py);
                }
              }
              ctx.strokeStyle = snake.color || '#DC2626';
              ctx.lineWidth = cellSize * 0.16;
              ctx.lineCap = 'round';
              ctx.stroke();

              ctx.strokeStyle = '#FECDD3';
              ctx.lineWidth = cellSize * 0.07;
              ctx.stroke();
              ctx.restore();

              // Snake Head
              ctx.save();
              ctx.fillStyle = snake.color || '#DC2626';
              ctx.beginPath();
              ctx.arc(head.x, head.y, cellSize * 0.2, 0, Math.PI * 2);
              ctx.fill();

              const eyeOffset = cellSize * 0.08;
              ctx.fillStyle = '#FFFFFF';
              ctx.beginPath();
              ctx.arc(head.x - eyeOffset, head.y - 3, cellSize * 0.07, 0, Math.PI * 2);
              ctx.arc(head.x + eyeOffset, head.y - 3, cellSize * 0.07, 0, Math.PI * 2);
              ctx.fill();

              ctx.fillStyle = '#111827';
              ctx.beginPath();
              ctx.arc(head.x - eyeOffset, head.y - 3, cellSize * 0.035, 0, Math.PI * 2);
              ctx.arc(head.x + eyeOffset, head.y - 3, cellSize * 0.035, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            });

            // 4. Update & Draw Players
            players.forEach((player, idx) => {
              const anim = animatedPositionsRef.current[idx];
              if (!anim) return;

              const speed = 0.25;
              const dx = anim.targetX - anim.x;
              const dy = anim.targetY - anim.y;
              const dist = Math.hypot(dx, dy);

              if (dist > 1) {
                anim.x += dx * speed;
                anim.y += dy * speed;
                anim.hop = Math.sin((Date.now() / 80) % Math.PI) * (cellSize * 0.2);
              } else {
                anim.x = anim.targetX;
                anim.y = anim.targetY;
                anim.hop = 0;
              }

              const bothOnSameTile = players.length > 1 && players[0].position === players[1].position && Math.hypot(anim.targetX - anim.x, anim.targetY - anim.y) < 2;
              let renderX = anim.x;
              let renderY = anim.y - anim.hop;
              if (bothOnSameTile) {
                renderX += idx === 0 ? -cellSize * 0.16 : cellSize * 0.16;
              }

              const isActive = idx === activePlayerIndex;
              const radius = cellSize * 0.25;

              ctx.save();
              if (isActive) {
                const pulse = Math.sin(Date.now() / 180) * 3;
                ctx.strokeStyle = player.color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(renderX, renderY, radius + 4 + pulse, 0, Math.PI * 2);
                ctx.stroke();
              }

              ctx.fillStyle = player.color;
              ctx.beginPath();
              ctx.arc(renderX, renderY, radius, 0, Math.PI * 2);
              ctx.fill();

              ctx.strokeStyle = '#FFFFFF';
              ctx.lineWidth = 2.5;
              ctx.stroke();
              ctx.restore();

              ctx.font = `${Math.floor(radius * 1.1)}px sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(player.avatar, renderX, renderY);
            });

            ctx.restore();
            animationFrameId = requestAnimationFrame(render);
          };

          render();
          return () => cancelAnimationFrame(animationFrameId);
        }, [boardSize, players, activePlayerIndex, highlightTile, hoveredTile, getCellPixelCenter]);

        const handleCanvasMouseMove = (e) => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const rect = canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const cellSize = boardSize / 10;
          const col = Math.floor(x / cellSize);
          const visualRow = Math.floor(y / cellSize);
          const row = 9 - visualRow;
          if (col >= 0 && col < 10 && row >= 0 && row < 10) {
            const tileNumber = row % 2 === 0 ? row * 10 + col + 1 : row * 10 + (9 - col) + 1;
            setHoveredTile(tileNumber);
          } else {
            setHoveredTile(null);
          }
        };

        const handleCanvasClick = (e) => {
          if (!onTileClick) return;
          const canvas = canvasRef.current;
          if (!canvas) return;
          const rect = canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const cellSize = boardSize / 10;
          const col = Math.floor(x / cellSize);
          const visualRow = Math.floor(y / cellSize);
          const row = 9 - visualRow;
          if (col >= 0 && col < 10 && row >= 0 && row < 10) {
            const tileNumber = row % 2 === 0 ? row * 10 + col + 1 : row * 10 + (9 - col) + 1;
            onTileClick(tileNumber);
          }
        };

        return (
          <div ref={containerRef} className="relative flex flex-col items-center justify-center w-full max-w-[680px] mx-auto select-none">
            <div className="relative rounded-2xl p-2 bg-gradient-to-b from-emerald-200/60 to-emerald-300/60 shadow-xl border border-emerald-300/80">
              <canvas
                ref={canvasRef}
                onMouseMove={handleCanvasMouseMove}
                onMouseLeave={() => setHoveredTile(null)}
                onClick={handleCanvasClick}
                className="rounded-xl cursor-pointer block touch-none"
              />
              {hoveredTile && (
                <div className="absolute bottom-4 left-1/2 -translate-x-1/2 px-3 py-1.5 bg-slate-900/90 text-white text-xs font-medium rounded-lg shadow-lg pointer-events-none whitespace-nowrap flex items-center gap-2 backdrop-blur-sm z-10">
                  <span>Petak #{hoveredTile}</span>
                  {LADDERS.find(l => l.from === hoveredTile) && (
                    <span className="text-emerald-300">🪜 Tangga naik ke #{LADDERS.find(l => l.from === hoveredTile)?.to}</span>
                  )}
                  {SNAKES.find(s => s.from === hoveredTile) && (
                    <span className="text-rose-300">🐍 Kepala Ular turun ke #{SNAKES.find(s => s.from === hoveredTile)?.to}</span>
                  )}
                  {BOARD_TILES.find(t => t.number === hoveredTile)?.ekosistemBonus && (
                    <span className="text-emerald-300">🌱 Materi: {BOARD_TILES.find(t => t.number === hoveredTile)?.ekosistemBonus?.english}</span>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      };

                    </p>

                  className="px-2.5 py-1.5 rounded-lg text-xs md:text-sm font-semibold text-slate-700 hover:text-indigo-800 hover:bg-indigo-100/60 transition-colors flex items-center gap-1 cursor-pointer"
                >
                  👥 <span className="hidden sm:inline">Ubah Pemain</span>
                </button>
                <button
                  onClick={handleToggleSound}
                  title={isMuted ? 'Nyalakan Suara' : 'Matikan Suara'}
                  className="p-2 rounded-lg text-slate-600 hover:bg-emerald-100/60 transition-colors cursor-pointer text-sm"
                >
                  {isMuted ? '🔇' : '🔊'}
                </button>
                <button
                  onClick={handleToggleFullscreen}
                  className="px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-xs transition-colors cursor-pointer hidden md:block"
                >
                  {isFullscreen ? 'Exit Fullscreen' : 'Layar Penuh'}
                </button>
              </nav>
            </div>
          </header>
        );
      };

      const INITIAL_PLAYERS = [
        { id: 1, name: 'Budi (P1)', avatar: '🐻', color: '#2563EB', position: 1, score: 0, streak: 0, correctAnswers: 0, wrongAnswers: 0, isAi: false },
        { id: 2, name: 'Siti (P2)', avatar: '🦊', color: '#E11D48', position: 1, score: 0, streak: 0, correctAnswers: 0, wrongAnswers: 0, isAi: false },
      ];

      function App() {
        const [players, setPlayers] = React.useState(INITIAL_PLAYERS);
        const [activePlayerIndex, setActivePlayerIndex] = React.useState(0);
        const [diceValue, setDiceValue] = React.useState(1);
        const [isRollingDice, setIsRollingDice] = React.useState(false);
        const [gamePhase, setGamePhase] = React.useState('WAITING_ROLL');
        const [pendingQuiz, setPendingQuiz] = React.useState(null);
        const [winner, setWinner] = React.useState(null);
        const [statusMessage, setStatusMessage] = React.useState('Selamat datang! Giliran Budi (P1) - Tekan Lempar Dadu untuk mulai.');

        const [isDictionaryOpen, setIsDictionaryOpen] = React.useState(false);
        const [isRulesOpen, setIsRulesOpen] = React.useState(false);
        const [isPlayerSetupOpen, setIsPlayerSetupOpen] = React.useState(false);

        const usedQuestionIdsRef = React.useRef(new Set());
        const activePlayer = players[activePlayerIndex];

        const advanceTurn = React.useCallback((bonusRoll = false) => {
          if (bonusRoll) {
            setStatusMessage(`Dadu 6! ${players[activePlayerIndex].name} mendapat kesempatan melempar lagi!`);
            setGamePhase('WAITING_ROLL');
            return;
          }
          const nextIndex = (activePlayerIndex + 1) % players.length;
          setActivePlayerIndex(nextIndex);
          setGamePhase('WAITING_ROLL');
          setStatusMessage(`Giliran ${players[nextIndex].name} - Silakan lempar dadu!`);
        }, [activePlayerIndex, players]);

        const executeStepMovement = React.useCallback((targetTile, rolledValue) => {
          setGamePhase('MOVING_TOKEN');
          let currentPos = players[activePlayerIndex].position;
          const stepDirection = targetTile > currentPos ? 1 : -1;

          const stepInterval = setInterval(() => {
            if (currentPos !== targetTile) {
              currentPos += stepDirection;
              soundManager.playStep();
              setPlayers(prev => prev.map((p, idx) => idx === activePlayerIndex ? { ...p, position: currentPos } : p));
            } else {
              clearInterval(stepInterval);

              if (currentPos === 100) {
                setWinner(players[activePlayerIndex]);
                setGamePhase('GAME_OVER');
                setStatusMessage(`🏆 Hore! ${players[activePlayerIndex].name} mencapai petak 100 dan menang!`);
                return;
              }

              const ladder = LADDERS.find(l => l.from === currentPos);
              if (ladder) {
                const question = getRandomQuizQuestion(usedQuestionIdsRef.current);
                usedQuestionIdsRef.current.add(question.id);
                setPendingQuiz({ type: 'LADDER', fromTile: currentPos, targetTile: ladder.to, question });
                setGamePhase('QUIZ_LADDER');
                setStatusMessage(`Tantangan Tangga di petak #${currentPos}! Jawab kuis untuk naik ke #${ladder.to}!`);
                return;
              }

              const snake = SNAKES.find(s => s.from === currentPos);
              if (snake) {
                const question = getRandomQuizQuestion(usedQuestionIdsRef.current);
                usedQuestionIdsRef.current.add(question.id);
                setPendingQuiz({ type: 'SNAKE', fromTile: currentPos, targetTile: snake.to, question });
                setGamePhase('QUIZ_SNAKE');
                setStatusMessage(`Waspada Ular di petak #${currentPos}! Jawab kuis untuk lolos dan tetap aman!`);
                return;
              }

              if (BONUS_TILES_MAP[currentPos]) {
                const question = getRandomQuizQuestion(usedQuestionIdsRef.current);
                usedQuestionIdsRef.current.add(question.id);
                setPendingQuiz({ type: 'BONUS', fromTile: currentPos, question });
                setGamePhase('QUIZ_BONUS');
                setStatusMessage(`Petak Kosakata Pakaian di #${currentPos}! Jawab kuis untuk bonus poin!`);
                return;
              }

              advanceTurn(rolledValue === 6);
            }
          }, 200);
        }, [activePlayerIndex, advanceTurn, players]);

        const handleRollDice = React.useCallback(() => {
          if (gamePhase !== 'WAITING_ROLL' || isRollingDice) return;
          setIsRollingDice(true);
          setGamePhase('ROLLING_DICE');
          setStatusMessage(`${activePlayer.name} sedang melempar dadu...`);

          let rolls = 0;
          const rollInterval = setInterval(() => {
            const tempVal = Math.floor(Math.random() * 6) + 1;
            setDiceValue(tempVal);
            rolls++;
            if (rolls >= 8) {
              clearInterval(rollInterval);
              const finalValue = Math.floor(Math.random() * 6) + 1;
              setDiceValue(finalValue);
              setIsRollingDice(false);

              const currentPos = activePlayer.position;
              const proposedPos = currentPos + finalValue;
              let dest = proposedPos;
              if (proposedPos > 100) {
                dest = 100 - (proposedPos - 100);
                setStatusMessage(`Dadu ${finalValue}! Melebihi 100, memantul ke petak #${dest}.`);
              } else {
                setStatusMessage(`Dadu ${finalValue}! Bergerak dari #${currentPos} ke #${dest}.`);
              }
              executeStepMovement(dest, finalValue);
            }
          }, 70);
        }, [activePlayer, executeStepMovement, gamePhase, isRollingDice]);

        // AI Bot logic handler
        React.useEffect(() => {
          if (activePlayer.isAi && gamePhase === 'WAITING_ROLL' && !winner && !pendingQuiz) {
            const timer = setTimeout(() => {
              handleRollDice();
            }, 1000);
            return () => clearTimeout(timer);
          }
        }, [activePlayer.isAi, gamePhase, handleRollDice, pendingQuiz, winner]);

        const handleResolveQuiz = (isCorrect) => {
          if (!pendingQuiz) return;
          const { type, targetTile } = pendingQuiz;
          const bonusRoll = diceValue === 6;

          setPlayers(prev => prev.map((p, idx) => {
            if (idx !== activePlayerIndex) return p;
            let newPos = p.position;
            let newScore = p.score;
            let newStreak = isCorrect ? p.streak + 1 : 0;
            let newCorrect = p.correctAnswers + (isCorrect ? 1 : 0);
            let newWrong = p.wrongAnswers + (!isCorrect ? 1 : 0);

            if (type === 'LADDER' && isCorrect && targetTile) {
              newPos = targetTile;
              newScore += 100 + newStreak * 10;
            } else if (type === 'SNAKE') {
              if (isCorrect) {
                newScore += 100 + newStreak * 10;
              } else if (targetTile) {
                newPos = targetTile;
              }
            } else if (type === 'BONUS' && isCorrect) {
              newScore += 50;
            }

            return {
              ...p,
              position: newPos,
              score: newScore,
              streak: newStreak,
              correctAnswers: newCorrect,
              wrongAnswers: newWrong,
            };
          }));

          if (type === 'LADDER' && isCorrect) {
            soundManager.playLadderClimb();
          } else if (type === 'SNAKE' && !isCorrect) {
            soundManager.playSnakeSlide();
          }

          setPendingQuiz(null);

          if (type === 'LADDER' && isCorrect && targetTile === 100) {
            setWinner(players[activePlayerIndex]);
            setGamePhase('GAME_OVER');
            return;
          }

          advanceTurn(bonusRoll);
        };

        const handleRestartGame = () => {
          setPlayers(prev => prev.map(p => ({ ...p, position: 1, score: 0, streak: 0, correctAnswers: 0, wrongAnswers: 0 })));
          setActivePlayerIndex(0);
          setDiceValue(1);
          setPendingQuiz(null);
          setWinner(null);
          setGamePhase('WAITING_ROLL');
          setStatusMessage('Permainan baru dimulai! Giliran Pemain 1 - Lempar Dadu!');
        };

        return (
          <div className="min-h-screen bg-gradient-to-b from-amber-50/60 via-orange-50/30 to-amber-100/50 flex flex-col">
            <Header
              onOpenDictionary={() => setIsDictionaryOpen(true)}
              onOpenRules={() => setIsRulesOpen(true)}
              onOpenPlayerSetup={() => setIsPlayerSetupOpen(true)}
            />

            <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-4 md:py-6 flex flex-col lg:flex-row items-center lg:items-start justify-center gap-6">
              <section className="w-full lg:w-7/12 flex flex-col items-center">
                <GameBoardCanvas
                  players={players}
                  activePlayerIndex={activePlayerIndex}
                  highlightTile={pendingQuiz?.fromTile}
                />
                <div className="mt-3 text-center text-xs text-slate-500">
                  Papan 10x10 Standard (1–100) • Sentuh petak untuk melihat rincian tangga atau ular
                </div>
              </section>

              <section className="w-full lg:w-5/12 flex flex-col items-center gap-5">
                <ScoreBoard
                  players={players}
                  activePlayerIndex={activePlayerIndex}
                  lastDiceRoll={diceValue}
                  message={statusMessage}
                />

                <div className="w-full max-w-xl bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-md border border-amber-200/90 flex flex-col items-center justify-center gap-4">
                  <div className="text-center">
                    <span className="text-xs font-bold text-amber-700 uppercase tracking-wider block mb-1">Area Lempar Dadu</span>
                    <p className="text-sm font-semibold text-slate-800">
                      {activePlayer.isAi ? 'Komputer Bot sedang bermain...' : `Giliran: ${activePlayer.name}`}
                    </p>
                  </div>

                  <DiceRoller
                    currentValue={diceValue}
                    isRolling={isRollingDice}
                    disabled={gamePhase !== 'WAITING_ROLL' || activePlayer.isAi}
                    playerColor={activePlayer.color}
                    playerName={activePlayer.name}
                    onRoll={handleRollDice}
                  />

                  <div className="w-full mt-2 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                    <span className="flex items-center gap-1.5">
                      🌱 <span>Mapel: <strong>IPAS SD Kelas 3 (Materi Ekosistem)</strong></span>
                    </span>
                    <button
                      onClick={() => setIsDictionaryOpen(true)}
                      className="text-emerald-700 hover:text-emerald-800 font-semibold cursor-pointer underline"
                    >
                      Buka Ringkasan Materi
                    </button>
                  </div>
                </div>
              </section>
            </main>

            {pendingQuiz && (
              <QuizModal
                quizEvent={pendingQuiz}
                playerName={activePlayer.name}
                playerAvatar={activePlayer.avatar}
                playerColor={activePlayer.color}
                onResolved={handleResolveQuiz}
              />
            )}

            <DictionaryModal isOpen={isDictionaryOpen} onClose={() => setIsDictionaryOpen(false)} />
            <RulesModal isOpen={isRulesOpen} onClose={() => setIsRulesOpen(false)} />
            <PlayerSetupModal isOpen={isPlayerSetupOpen} players={players} onSave={(updated) => setPlayers(updated)} onClose={() => setIsPlayerSetupOpen(false)} />
            {winner && <GameOverModal winner={winner} players={players} onRestart={handleRestartGame} />}
          </div>
        );
      }

      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>
